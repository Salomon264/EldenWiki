services:
  db:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-AlikGumerov8g}
      MYSQL_DATABASE: eldenwiki
    ports:
      # Внешний порт 3307, чтобы не конфликтовать с локальным MySQL на 3306.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Сюда можно положить .sql-дамп для автоимпорта при первом запуске.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./EldenApi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: "server=db;port=3306;database=eldenwiki;user=root;password=${MYSQL_ROOT_PASSWORD:-AlikGumerov8g}"
      # Ключ подписи JWT. Переопределяется через .env (переменная JWT_KEY).
      Jwt__Key: ${JWT_KEY:-dev-only-insecure-signing-key-change-me-0123456789}
      Jwt__Issuer: EldenWiki
      Jwt__Audience: EldenWiki
      Jwt__LifetimeMinutes: "120"
    ports:
      - "8080:8080"

volumes:
  db_data:
